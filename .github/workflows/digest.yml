name: Daily AI digest
on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours, so the page stays current
  workflow_dispatch:       # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency: digest
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Build digest
        run: python pipeline/digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      - name: Commit result
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || (git commit -m "digest $(date -u +%F)" && git push)
