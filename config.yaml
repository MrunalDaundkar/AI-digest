# ---- Edit this file to tune your digest. No code changes needed. ----
counts:            # items shown per tab each day
  technical: 10
  business: 10
  models: 6
max_age_hours: 48  # ignore articles older than this
max_per_source: 3  # keeps one site from filling the whole list
keep_days: 30      # older daily files are deleted

keywords:          # items matching more of these rank higher
  technical: [computer vision, perception, adas, autonomous, self-driving, lidar, radar, sensor fusion, object detection, segmentation, vision-language, diffusion, multimodal, robotics, edge ai, open-source, benchmark, transformer, llm, agent, 3d, slam, bev]
  business: [investment, invest, funding, raises, billion, valuation, acquisition, acquires, ipo, earnings, revenue, capex, data center, chips, partnership, regulation, layoffs, deal]

# weight: 0.5 (low) to 2 (high). max: entries read from that feed.
sources:
  # --- Technical ---
  - {name: TLDR AI, track: technical, url: "https://tldr.tech/api/rss/ai", weight: 1.6}
  - {name: TLDR Data, track: technical, url: "https://tldr.tech/api/rss/data", weight: 1.2}
  - {name: Hugging Face Blog, track: technical, url: "https://huggingface.co/blog/feed.xml", weight: 1.5}
  - {name: Google DeepMind, track: technical, url: "https://deepmind.google/blog/rss.xml", weight: 1.5}
  - {name: OpenAI, track: technical, url: "https://openai.com/news/rss.xml", weight: 1.5}
  - {name: NVIDIA Developer, track: technical, url: "https://developer.nvidia.com/blog/feed", weight: 1.3}
  - {name: Import AI, track: technical, url: "https://importai.substack.com/feed", weight: 1.3}
  - {name: MarkTechPost, track: technical, url: "https://www.marktechpost.com/feed/", weight: 1.0}
  - {name: BAIR Blog, track: technical, url: "https://bair.berkeley.edu/blog/feed.xml", weight: 1.2}
  - {name: arXiv cs.CV, track: technical, url: "https://rss.arxiv.org/rss/cs.CV", weight: 0.6, max: 40}
  - {name: arXiv cs.RO, track: technical, url: "https://rss.arxiv.org/rss/cs.RO", weight: 0.6, max: 40}
  # --- Business and market ---
  - {name: TechCrunch AI, track: business, url: "https://techcrunch.com/category/artificial-intelligence/feed/", weight: 1.5}
